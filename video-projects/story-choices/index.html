<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1b1b1b; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .vwrap { position: absolute; inset: 0; }
      .vwrap video { width: 100%; height: 100%; object-fit: cover; }

      /* Looks like Instagram's own text tool: plain text on white line-boxes */
      .note { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 0 70px; text-align: center; }
      .note p { font-size: 40px; font-weight: 600; line-height: 1.52; color: #111; max-width: 920px; text-wrap: balance; }
      .note p span { background: #fff; padding: 4px 14px; border-radius: 10px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
      .note p.big { font-size: 50px; font-weight: 800; }
      #top { top: 220px; }
      #bottom { top: 975px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div class="vwrap"><video id="v" data-start="0" data-duration="15" data-track-index="0" src="assets/bg.mp4" muted playsinline></video></div>

      <div id="top" class="note clip" data-start="0" data-duration="15" data-track-index="1">
        <p class="big"><span>Why choices matter 🤍</span></p>
      </div>

      <div id="bottom" class="note clip" data-start="0" data-duration="15" data-track-index="2">
        <p><span>The healthiest plan isn’t the strictest one. It’s the one you can keep doing.</span></p>
        <p><span>When you can swap a meal, eat out, or enjoy the birthday cake, you stick with it for months, not days.</span></p>
        <p><span>That’s where real change happens.</span></p>
      </div>
    </div>
    <script>
      // Personal-story style: all text on screen from the start, no motion graphics.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
