<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1a1a; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .vwrap { position: absolute; inset: 0; }
      .vwrap video { width: 100%; height: 100%; object-fit: cover; }

      /* Simple native-style text: white with a navy outline, on screen the whole time */
      .txt {
        position: absolute; left: 0; right: 0; padding: 0 56px; text-align: center;
        color: #ffffff; font-weight: 800; letter-spacing: -0.01em;
        -webkit-text-stroke: 9px #001f3f; paint-order: stroke fill;
        text-shadow: 0 4px 18px rgba(0, 20, 40, 0.35);
      }
      #top { top: 210px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #hook { font-size: 60px; line-height: 1.1; text-wrap: balance; }
      #sub { font-size: 44px; line-height: 1.2; text-wrap: balance; }
      #reasons { top: 1130px; }
      #list { font-size: 40px; line-height: 1.22; display: flex; flex-direction: column; gap: 14px; }
      #list div { text-wrap: balance; }
      #cta { top: 0px; font-size: 42px; line-height: 1.2; text-wrap: balance; }
      #scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,31,63,0.42) 0%, rgba(0,31,63,0) 26%, rgba(0,31,63,0) 52%, rgba(0,31,63,0.45) 60%, rgba(0,31,63,0.45) 88%, rgba(0,31,63,0) 96%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div class="vwrap">
        <video id="v-bg" data-start="0" data-duration="14" data-track-index="0" src="assets/bg.mp4" muted playsinline></video>
      </div>
      <div id="scrim" class="clip" data-start="0" data-duration="14" data-track-index="4"></div>
      <div id="top" class="txt clip" data-start="0" data-duration="14" data-track-index="1">
        <div id="hook">“Fibermaxxing” is everywhere. Here’s how to do it without the bloating:</div>
      </div>
      <div id="reasons" class="txt clip" data-start="0" data-duration="14" data-track-index="3">
        <div id="list">
          <div>1. Add fiber slowly, a little more each week</div>
          <div>2. Drink more water as you go</div>
          <div>3. Mix it up: veg, beans, lentils, oats, seeds</div>
          <div>4. Add fermented foods like yogurt and sauerkraut</div>
        </div>
      </div>
    </div>
    <script>
      // Text-only reel: copy is static for the full duration, like a native text post.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
