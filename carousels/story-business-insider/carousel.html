<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face { font-family: "OS"; src: url("fonts/open-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "OS"; src: url("fonts/open-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "OS"; src: url("fonts/open-sans-latin-600-italic.woff2") format("woff2"); font-weight: 600; font-style: italic; }
      :root { --box: #ebe6e5; --surface: #f7f4f3; --navy: #001f3f; --blue: #94b4da; --terra: #c76d62; --blush: #f6b5aa; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #222; font-family: "OS", sans-serif; }
      .slide { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--box); color: var(--navy); }

      /* soft brand shapes */
      .blob { position: absolute; border-radius: 50%; }
      .b1 { width: 760px; height: 760px; right: -260px; top: -200px; background: rgba(148,180,218,0.35); }
      .b2 { width: 620px; height: 620px; left: -240px; bottom: 120px; background: rgba(246,181,170,0.35); }

      .kicker { position: absolute; top: 230px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 40px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--terra); }
      .pub { position: absolute; top: 290px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 92px; letter-spacing: -0.01em; }

      .card {
        position: absolute; left: 90px; right: 90px; background: #fff; border-radius: 26px;
        box-shadow: 0 18px 50px rgba(0,31,63,0.16); overflow: hidden;
      }
      .card img { display: block; width: 100%; }
      #c1 { top: 470px; padding: 34px 40px 30px; transform: rotate(-1.6deg); }
      #c2 { top: 760px; padding: 30px 36px 26px; transform: rotate(1.2deg); }
      .hl { position: absolute; left: 36px; right: 36px; top: 30px; height: 74%; background: rgba(246,181,170,0.42); border-radius: 10px; mix-blend-mode: multiply; }

      .quote { position: absolute; left: 90px; right: 90px; top: 1130px; display: flex; align-items: center; gap: 34px; }
      .photo { flex: 0 0 auto; width: 250px; height: 250px; border-radius: 50%; overflow: hidden; border: 8px solid #fff; box-shadow: 0 12px 34px rgba(0,31,63,0.2); }
      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
      .qtext { font-style: italic; font-weight: 600; font-size: 54px; line-height: 1.18; }
      .who { margin-top: 14px; font-style: normal; font-weight: 700; font-size: 30px; color: rgba(0,31,63,0.7); line-height: 1.3; }

      .read { position: absolute; left: 0; right: 0; top: 1610px; text-align: center; }
      .read { font-weight: 800; font-size: 40px; color: #f7f4f3; }
      .read { width: max-content; margin: 0 auto; background: var(--navy); border-radius: 999px; padding: 14px 40px 18px; }
      .thanks { position: absolute; left: 90px; right: 90px; top: 1440px; text-align: center; font-weight: 700; font-size: 38px; line-height: 1.35; text-wrap: balance; }
    </style>
  </head>
  <body>
    <section class="slide">
      <div class="blob b1"></div>
      <div class="blob b2"></div>

      <div class="kicker">As featured in</div>
      <div class="pub">Business Insider</div>

      <div class="card" id="c1"><img src="img/headline.png" alt="Article headline" /></div>
      <div class="card" id="c2"><div class="hl"></div><img src="img/laurel-para.png" alt="Laurel Santiago quoted in the article" /></div>

      <div class="quote">
        <div class="photo"><img src="img/laurel.jpg" alt="Laurel Santiago" /></div>
        <div>
          <div class="qtext">“I think they nailed a good balance.”</div>
          <div class="who">Laurel Santiago, licensed dietitian-nutritionist</div>
        </div>
      </div>

      <div class="thanks">So grateful to share my take on Bryan Johnson's new longevity meals 🤍</div>
      <div class="read">Read the full article 👇</div>
    </section>
  </body>
</html>
